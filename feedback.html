<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Feedback — Focus Forum 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --orange:    #E8701A;
  --orange-hi: #FF9040;
  --cream:     #F2EBDA;
  --muted:     rgba(242,235,218,0.45);
  --bg:        #0C0A08;
}

html, body {
  background: var(--bg);
  min-height: 100%;
  font-family: 'EB Garamond', serif;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5vh 1.5rem 6vh;
  color: var(--cream);
}

.card { width: 100%; max-width: 640px; }

.brand {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 2.8rem;
}
.brand-hex { width: 30px; height: 34px; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; gap: .06rem; }
.brand-name {
  font-family: 'Cinzel', serif; font-size: .88rem;
  font-weight: 600; letter-spacing: .06em; color: var(--cream);
}
.brand-sub {
  font-family: 'Cinzel', serif; font-size: .58rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--orange);
}

.form-kicker {
  font-family: 'Cinzel', serif; font-size: .62rem; font-weight: 700;
  letter-spacing: .2em; text-transform: uppercase; color: var(--orange);
  margin-bottom: .7rem;
}
.form-heading {
  font-family: 'Cinzel', serif; font-size: 1.7rem; font-weight: 600;
  letter-spacing: .03em; line-height: 1.15; color: var(--cream);
  margin-bottom: .85rem;
}
.form-lede {
  color: var(--muted); font-size: 1.02rem; margin-bottom: 2rem;
  border-bottom: 1px solid rgba(232,112,26,.14); padding-bottom: 2rem;
}

.form-frame {
  width: 100%;
  border: none;
  background: transparent;
  min-height: 600px;
}

.back-link {
  display: inline-block;
  margin-top: 2rem;
  font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); text-decoration: none;
  transition: color .2s;
}
.back-link:hover { color: var(--cream); }
</style>
</head>
<body>

<div class="card">

  <div class="brand">
    <svg class="brand-hex" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="og-fb" cx="50%" cy="42%" r="58%" gradientUnits="objectBoundingBox">
          <stop offset="0%" stop-color="#CC5428"/>
          <stop offset="100%" stop-color="#7A2E10"/>
        </radialGradient>
        <filter id="c-engrave-fb" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="bmap"/>
          <feDiffuseLighting in="bmap" lighting-color="#8a6040" surfaceScale="-7" diffuseConstant="1.9" result="lit">
            <feDistantLight azimuth="135" elevation="38"/>
          </feDiffuseLighting>
          <feComposite in="lit" in2="SourceAlpha" operator="in" result="litMask"/>
          <feBlend in="SourceGraphic" in2="litMask" mode="hard-light" result="blended"/>
          <feComposite in="blended" in2="SourceAlpha" operator="in"/>
        </filter>
      </defs>
      <polygon points="200,10 364.54,105 364.54,295 200,390 35.46,295 35.46,105" fill="#0a0a0a"/>
      <polygon points="200,18 357.61,109 357.61,291 200,382 42.39,291 42.39,109" fill="url(#og-fb)"/>
      <path d="M302.19,141 L200,82 L97.81,141 L97.81,259 L200,318 L302.19,259 L302.19,239 L267.55,239 L200,278 L132.45,239 L132.45,161 L200,122 L267.55,161 L302.19,161 Z" fill="#235023" filter="url(#c-engrave-fb)"/>
    </svg>
    <div class="brand-text">
      <div class="brand-name">Cooper's Consulting</div>
      <div class="brand-sub">Focus Forum 2026</div>
    </div>
  </div>

  <div class="form-kicker">Attendee Feedback</div>
  <h1 class="form-heading">Tell us what you think.</h1>
  <p class="form-lede">What landed? What are you taking home? What would you change? We read every word.</p>

  <iframe
    class="form-frame"
    src="https://docs.google.com/forms/d/e/1FAIpQLSemFhLDyjCd6SbbpiAjFsJ6nxr5EQ7qA0p8Wok0DqAq_9Cong/viewform?embedded=true"
    title="Focus Forum 2026 Feedback Form"
    loading="lazy"
  >Loading…</iframe>

  <a href="forum.html" class="back-link">&larr; Back to the attendee guide</a>

</div>

</body>
</html>
